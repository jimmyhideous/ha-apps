# https://contributors.home-assistant.io/apps/reference/configuration/
name: SMART to MQTT
version: "1.0.1"
slug: smart_mqtt
description: Publishes disk SMART data from UDisks2 to MQTT with Home Assistant discovery
url: "https://github.com/jimmyhideous/ha-apps/tree/main/smart_mqtt"
arch:
  - aarch64
  - amd64
init: false
host_dbus: true
services:
  - mqtt:want
options:
  discovery_prefix: homeassistant
  log_level: info
  mqtt_port: 1883
  mqtt_tls: false
schema:
  discovery_prefix: match(^[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*$)
  log_level: list(debug|info|warning|error)
  mqtt_host: match(^[A-Za-z0-9][A-Za-z0-9.:-]*$)?
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  mqtt_tls: bool
image: "ghcr.io/jimmyhideous/app-smart-mqtt"

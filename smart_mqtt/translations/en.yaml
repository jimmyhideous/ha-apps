---
configuration:
  discovery_prefix:
    name: Discovery prefix
    description: MQTT discovery prefix of Home Assistant's MQTT integration.
  log_level:
    name: Log level
    description: Lowest level the app logs. Debug logs every reading.
  mqtt_host:
    name: MQTT host
    description: >-
      External MQTT broker, a hostname or IP address. Leave empty to use the MQTT broker app, such as Mosquitto.
  mqtt_port:
    name: MQTT port
    description: Port of the external broker.
  mqtt_username:
    name: MQTT username
    description: Login for the external broker.
  mqtt_password:
    name: MQTT password
    description: Password for the external broker.
  mqtt_tls:
    name: MQTT TLS
    description: >-
      Connect to the external broker with TLS. Without a CA certificate, the app checks the broker's certificate
      against the system's public CAs.
  mqtt_ca_cert:
    name: MQTT CA certificate
    description: >-
      File in /ssl with the CA certificate (PEM) that signed the broker's certificate, for example mqtt/ca.pem.
      Needs MQTT TLS.
  mqtt_client_cert:
    name: MQTT client certificate
    description: File in /ssl with the client certificate (PEM), for a broker that requires one. Needs MQTT TLS.
  mqtt_client_key:
    name: MQTT client key
    description: >-
      File in /ssl with the client certificate's private key (PEM). Leave empty when the key is in the client
      certificate file.

# https://contributors.home-assistant.io/apps/reference/configuration/
name: HA Alloy
version: "1.2.2"
slug: ha_alloy
description: Ships the Home Assistant OS journal to Grafana Loki with Grafana Alloy
url: "https://github.com/jimmyhideous/ha-apps/tree/main/ha_alloy"
arch:
  - aarch64
  - amd64
init: false
startup: services
journald: true
ingress: true
panel_icon: mdi:chart-timeline-variant
panel_title: Alloy
map:
  - type: addon_config
    read_only: false
options:
  loki_url: "http://loki:3100/loki/api/v1/push"
  host_label: "homeassistant"
  max_age: "12h"
  config_mode: merged
  log_level: warn
  tls_insecure_skip_verify: false
schema:
  loki_url: url
  host_label: match(^[A-Za-z0-9][A-Za-z0-9_.-]*$)
  max_age: match(^[0-9]+(s|m|h)$)
  config_mode: list(builtin|merged|custom)
  log_level: list(error|warn|info|debug)
  exclude: str?
  memory_limit: match(^[0-9]+(B|KiB|MiB|GiB|TiB)?$)?
  bearer_token: password?
  basic_auth_username: str?
  basic_auth_password: password?
  tenant_id: str?
  tls_insecure_skip_verify: bool
  ca_file: match(^/config/.+)?
image: "ghcr.io/jimmyhideous/app-ha-alloy"

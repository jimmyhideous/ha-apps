name: Build app

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      publish:
        required: true
        type: boolean

jobs:
  prepare:
    name: Prepare
    if: github.repository == 'jimmyhideous/ha-apps'
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ inputs.app }}"

      - name: Normalize app information
        id: normalize
        run: |
          image=${{ steps.info.outputs.image }}
          echo "image_name=${image##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${image%/*}" >> "$GITHUB_OUTPUT"
          version=${{ steps.info.outputs.version }}
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          name=${{ steps.info.outputs.name }}
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          description=${{ steps.info.outputs.description }}
          echo "description=${description}" >> "$GITHUB_OUTPUT"
          url=${{ steps.info.outputs.url }}
          if [[ -n "$url" && "$url" != "null" ]]; then
            echo "url=${url}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  smoke-test:
    name: Smoke test
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Find the app's smoke test
        id: test
        run: |
          if [[ -f "${{ inputs.app }}/tests/smoke.sh" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No ${{ inputs.app }}/tests/smoke.sh, nothing to run."
          fi

      - name: Build the amd64 image
        if: steps.test.outputs.run == 'true'
        run: docker buildx build --load --platform linux/amd64 -t "smoke/${{ inputs.app }}:ci" "./${{ inputs.app }}"

      - name: Run the smoke test
        if: steps.test.outputs.run == 'true'
        run: bash "${{ inputs.app }}/tests/smoke.sh" "smoke/${{ inputs.app }}:ci"

  build:
    name: Build ${{ matrix.arch }} image
    needs: [prepare, smoke-test]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./${{ inputs.app }}"
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          push: ${{ inputs.publish }}
          # Never re-push a published version (e.g. after a workflow-only change): bump `version` instead.
          skip-existing: ${{ needs.prepare.outputs.version }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
          skip-existing: ${{ needs.prepare.outputs.version }}

  verify:
    name: Verify published image
    needs: [prepare, manifest]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      packages: read
    env:
      IMAGE: ${{ needs.prepare.outputs.registry_prefix }}/${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.version }}
      ARCHS: ${{ needs.prepare.outputs.architectures }}
    steps:
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check the manifest lists every architecture
        run: |
          platforms=$(docker buildx imagetools inspect --raw "${IMAGE}" | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"')
          echo "${IMAGE}:"; echo "${platforms}"
          for arch in $(jq -r '.[]' <<< "${ARCHS}"); do
            [[ "${arch}" == "aarch64" ]] && arch=arm64
            grep -qx "linux/${arch}" <<< "${platforms}" || { echo "::error::${IMAGE} has no linux/${arch} image"; exit 1; }
          done

      - name: Run the amd64 image
        run: docker run --rm --platform linux/amd64 --entrypoint /usr/bin/alloy "${IMAGE}" --version

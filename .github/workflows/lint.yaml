name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  # Lets the Renovate version-bump workflow re-run the lint on the commit it pushed.
  workflow_dispatch:

jobs:
  find:
    name: Find apps
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.addons.outputs.addons_list }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: 🔍 Find app directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

  lint:
    name: Lint app ${{ matrix.path }}
    runs-on: ubuntu-latest
    needs: find
    strategy:
      matrix:
        path: ${{ fromJson(needs.find.outputs.addons) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: 🚀 Run Home Assistant App Lint
        uses: frenck/action-addon-linter@v2.21
        with:
          path: "./${{ matrix.path }}"

  status:
    name: Lint status
    needs: [find, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check that every app passed the linter
        env:
          FIND: ${{ needs.find.result }}
          LINT: ${{ needs.lint.result }}
        run: |
          echo "find: ${FIND}, lint: ${LINT}"
          [[ "${FIND}" == "success" && "${LINT}" == "success" ]]

name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  # Manual runs.
  workflow_dispatch:

jobs:
  find:
    name: Find apps
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.addons.outputs.addons_list }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔍 Find app directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@9e9565e68f5a70d874202871f4c4064d23814235 # master

  lint:
    name: Lint app ${{ matrix.path }}
    runs-on: ubuntu-latest
    needs: find
    strategy:
      matrix:
        path: ${{ fromJson(needs.find.outputs.addons) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🚀 Run Home Assistant App Lint
        uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2.21
        with:
          path: "./${{ matrix.path }}"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🚀 Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          # s6 service scripts have no extension and a bashio shebang, which the action doesn't detect as shell.
          additional_files: run finish
          # Notes and style suggestions show in the log without failing the check.
          severity: warning
        env:
          SHELLCHECK_OPTS: -s bash

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🚀 Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true
          # DL3008: pinned Debian package versions break the build on every Debian update, and Renovate doesn't
          # track them.
          ignore: DL3008

  status:
    name: Lint status
    needs: [find, lint, shellcheck, hadolint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check that every app passed the linters
        env:
          FIND: ${{ needs.find.result }}
          LINT: ${{ needs.lint.result }}
          SHELLCHECK: ${{ needs.shellcheck.result }}
          HADOLINT: ${{ needs.hadolint.result }}
        run: |
          echo "find: ${FIND}, lint: ${LINT}, shellcheck: ${SHELLCHECK}, hadolint: ${HADOLINT}"
          [[ "${FIND}" == "success" && "${LINT}" == "success" && "${SHELLCHECK}" == "success" && "${HADOLINT}" == "success" ]]
